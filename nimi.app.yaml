app_id: openmontage.studio
display_name: OpenMontage
version: 0.1.1
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
capability_contract_refs:
  - text.generate
  - image.generate
  - audio.synthesize
  - audio.transcribe
  - video.generate
  - music.generate
required_standardized_feature_refs: []
safety_profile:
  intended_audience: general
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features: []
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: image
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: audio
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: video
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: false
    telemetry: []
    third_party_account: none
    user_content_sharing: none
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
storage_policy:
  kind: nimi-mediated-default
metadata:
  summary: "Produce narrated videos from source footage and generated media, with transcription, subtitles and local rendering powered by Nimi."
  icon: assets/app-icon.png
  readme: NIMI_APP.md
  release_notes: RELEASE_NOTES.md
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1461
