build_profile_ref: electron-packager-pnpm-vite
test_command: pnpm run test:app
build_command: pnpm run build:electron:production
output_path: dist-electron-package
lockfile_path: pnpm-lock.yaml
lockfile_policy: author-install-generates-lockfile
ci_install_command: pnpm install --frozen-lockfile
targets:
  windows-x86_64:
    os: windows
    arch: x86_64
    build_command: pnpm run build:electron:production
    payload_path: dist-electron-package/openmontage-nimi-app-shell-win32-x64
    runtime_entry: payload/openmontage-nimi-app-shell.exe
  macos-aarch64:
    os: macos
    arch: arm64
    build_command: /bin/sh -c 'ulimit -n 65536 && pnpm run build:electron:production'
    payload_path: dist-electron-package/openmontage-nimi-app-shell-darwin-arm64
    runtime_entry: payload/openmontage-nimi-app-shell.app/Contents/MacOS/openmontage-nimi-app-shell
profile_role: developer-workflow-input
